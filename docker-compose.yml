services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsedesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsedesk
      POSTGRES_PASSWORD: pulsedesk
      POSTGRES_DB: pulsedesk
    ports:
      - "5433:5432"
    volumes:
      - pulsedesk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsedesk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pulsedesk-postgres-data:
